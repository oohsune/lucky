<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍀 幸运时刻</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; }

        /* ===== 背景 ===== */
        #bg { position: fixed; inset: 0; z-index: 0; background-size: cover; background-position: center; transition: opacity 0.8s; }
        #bg-overlay { position: fixed; inset: 0; z-index: 1; background: rgba(0,0,0,0.3); }
        #particles { position: fixed; inset: 0; z-index: 2; }

        /* ===== 主容器 ===== */
        #app { position: relative; z-index: 3; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

        /* ===== 主题变量 ===== */
        :root {
            --primary: #ffd700;
            --glow: rgba(255,215,0,0.4);
            --text: #fff;
            --font-title: 'Microsoft YaHei', sans-serif;
            --font-body: 'Microsoft YaHei', sans-serif;
        }

        /* ===== 中国风 ===== */
        .theme-chinese { --primary: #ff2222; --glow: rgba(255,34,34,0.4); --font-title: 'KaiTi', 'STKaiti', serif; --font-body: 'SimSun', 'STSong', serif; }
        .theme-chinese .title { font-family: var(--font-title); letter-spacing: 12px; text-shadow: 0 0 30px var(--glow), 0 4px 20px rgba(0,0,0,0.5); }
        .theme-chinese .subtitle { font-family: var(--font-body); letter-spacing: 8px; }
        .theme-chinese .lottery-box { border: 3px solid rgba(255,34,34,0.4); border-radius: 8px; background: rgba(139,0,0,0.15); }
        .theme-chinese .slot { font-family: var(--font-title); }
        .theme-chinese .draw-btn { background: linear-gradient(135deg, #ff2222, #cc0000); border-radius: 8px; font-family: var(--font-title); letter-spacing: 6px; }
        .theme-chinese .deco-left, .theme-chinese .deco-right { position: fixed; top: 50%; transform: translateY(-50%); font-size: 80px; opacity: 0.15; z-index: 2; }
        .theme-chinese .deco-left { left: 30px; }
        .theme-chinese .deco-right { right: 30px; }

        /* ===== 科技感 ===== */
        .theme-tech { --primary: #00ffff; --glow: rgba(0,255,255,0.4); --font-title: 'Consolas', 'Courier New', monospace; --font-body: 'Consolas', monospace; }
        .theme-tech .title { font-family: var(--font-title); letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 0 20px var(--glow), 0 0 40px var(--glow); }
        .theme-tech .subtitle { font-family: var(--font-body); letter-spacing: 3px; opacity: 0.7; }
        .theme-tech .lottery-box { border: 1px solid rgba(0,255,255,0.3); border-radius: 0; background: rgba(0,20,40,0.4); clip-path: polygon(0 10px, 10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px)); }
        .theme-tech .slot { font-family: var(--font-title); }
        .theme-tech .draw-btn { background: linear-gradient(135deg, #00ffff, #0088ff); border-radius: 0; clip-path: polygon(0 8px, 8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px)); font-family: var(--font-title); letter-spacing: 4px; text-transform: uppercase; }
        .theme-tech .hud-corner { position: fixed; width: 60px; height: 60px; border: 2px solid rgba(0,255,255,0.3); z-index: 2; }
        .theme-tech .hud-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .theme-tech .hud-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .theme-tech .hud-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .theme-tech .hud-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* ===== 黑金奢华 ===== */
        .theme-luxury { --primary: #ffd700; --glow: rgba(255,215,0,0.4); --font-title: 'Georgia', 'Times New Roman', serif; --font-body: 'Georgia', serif; }
        .theme-luxury .title { font-family: var(--font-title); letter-spacing: 8px; font-weight: 400; text-shadow: 0 0 30px var(--glow), 0 2px 10px rgba(0,0,0,0.8); }
        .theme-luxury .subtitle { font-family: var(--font-body); letter-spacing: 6px; font-style: italic; opacity: 0.6; }
        .theme-luxury .lottery-box { border: 1px solid rgba(255,215,0,0.3); border-radius: 0; background: rgba(0,0,0,0.3); }
        .theme-luxury .slot { font-family: var(--font-title); font-weight: 400; }
        .theme-luxury .draw-btn { background: linear-gradient(135deg, #ffd700, #b8860b); border-radius: 0; font-family: var(--font-title); letter-spacing: 6px; font-weight: 400; }
        .theme-luxury .gold-line { position: fixed; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,215,0,0.5), transparent); z-index: 2; }
        .theme-luxury .gold-line-top { top: 40px; left: 10%; right: 10%; }
        .theme-luxury .gold-line-bottom { bottom: 40px; left: 10%; right: 10%; }

        /* ===== 美妆风 ===== */
        .theme-beauty { --primary: #ff69b4; --glow: rgba(255,105,180,0.4); --font-title: 'Comic Sans MS', 'Segoe Print', cursive; --font-body: 'Segoe UI', sans-serif; }
        .theme-beauty .title { font-family: var(--font-title); letter-spacing: 4px; text-shadow: 0 0 20px var(--glow), 0 2px 10px rgba(0,0,0,0.3); }
        .theme-beauty .subtitle { font-family: var(--font-body); letter-spacing: 3px; opacity: 0.7; }
        .theme-beauty .lottery-box { border: 2px solid rgba(255,105,180,0.3); border-radius: 30px; background: rgba(255,182,193,0.1); }
        .theme-beauty .slot { font-family: var(--font-title); }
        .theme-beauty .draw-btn { background: linear-gradient(135deg, #ff69b4, #ff1493); border-radius: 30px; font-family: var(--font-title); letter-spacing: 3px; }
        .theme-beauty .petal { position: fixed; font-size: 24px; opacity: 0.2; z-index: 2; animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-20px) rotate(10deg)} }

        /* ===== 金融风 ===== */
        .theme-finance { --primary: #ffd700; --glow: rgba(255,215,0,0.3); --font-title: 'Arial', 'Helvetica', sans-serif; --font-body: 'Arial', sans-serif; }
        .theme-finance .title { font-family: var(--font-title); letter-spacing: 6px; font-weight: 700; text-shadow: 0 0 20px var(--glow), 0 2px 10px rgba(0,0,0,0.5); }
        .theme-finance .subtitle { font-family: var(--font-body); letter-spacing: 4px; opacity: 0.6; }
        .theme-finance .lottery-box { border: 2px solid rgba(255,215,0,0.2); border-radius: 4px; background: rgba(0,20,60,0.3); }
        .theme-finance .slot { font-family: var(--font-title); font-weight: 700; }
        .theme-finance .draw-btn { background: linear-gradient(135deg, #ffd700, #daa520); border-radius: 4px; font-family: var(--font-title); letter-spacing: 4px; font-weight: 700; }
        .theme-finance .grid-line { position: fixed; background: rgba(255,215,0,0.05); z-index: 2; }
        .theme-finance .grid-v { width: 1px; top: 0; bottom: 0; }
        .theme-finance .grid-h { height: 1px; left: 0; right: 0; }

        /* ===== 生活风 ===== */
        .theme-lifestyle { --primary: #ff8c00; --glow: rgba(255,140,0,0.4); --font-title: 'Segoe Print', 'Comic Sans MS', cursive; --font-body: 'Segoe UI', sans-serif; }
        .theme-lifestyle .title { font-family: var(--font-title); letter-spacing: 3px; text-shadow: 0 0 20px var(--glow), 0 2px 10px rgba(0,0,0,0.3); }
        .theme-lifestyle .subtitle { font-family: var(--font-body); letter-spacing: 2px; opacity: 0.7; }
        .theme-lifestyle .lottery-box { border: 3px dashed rgba(255,140,0,0.3); border-radius: 20px; background: rgba(255,200,100,0.1); }
        .theme-lifestyle .slot { font-family: var(--font-title); }
        .theme-lifestyle .draw-btn { background: linear-gradient(135deg, #ff8c00, #ff6600); border-radius: 20px; font-family: var(--font-title); letter-spacing: 2px; }
        .theme-lifestyle .leaf { position: fixed; font-size: 20px; opacity: 0.15; z-index: 2; animation: sway 5s ease-in-out infinite; }
        @keyframes sway { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }

        /* ===== 通用元素 ===== */
        .title { font-size: 56px; font-weight: 900; color: var(--primary); margin-bottom: 8px; text-align: center; transition: all 0.5s; }
        .subtitle { font-size: 16px; color: rgba(255,255,255,0.6); margin-bottom: 24px; text-align: center; transition: all 0.5s; }
        .status { display: flex; gap: 24px; margin-bottom: 20px; font-size: 13px; color: rgba(255,255,255,0.5); }
        .status b { color: var(--primary); font-size: 18px; }

        .lottery-box {
            width: min(700px, 90vw); height: 220px;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 0 40px var(--glow);
            transition: all 0.4s; margin-bottom: 28px;
        }
        .lottery-box.winner { box-shadow: 0 0 80px var(--glow); }

        .slots { display: flex; gap: 16px; width: 100%; padding: 0 24px; justify-content: center; }
        .slot {
            flex: 1; max-width: 280px; text-align: center;
            font-size: 2.6rem; font-weight: 800; color: var(--text);
            min-height: 60px; display: flex; align-items: center; justify-content: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .slot.rolling { color: rgba(255,255,255,0.6); animation: flicker 0.1s infinite; }
        @keyframes flicker { 0%,100%{opacity:0.6} 50%{opacity:1} }
        .slot.winner { color: var(--primary); text-shadow: 0 0 20px var(--glow); animation: pop 0.6s cubic-bezier(0.175,0.885,0.32,1.275); }
        @keyframes pop { 0%{transform:scale(0.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }

        .draw-btn {
            width: 200px; height: 58px; border: none; cursor: pointer;
            color: #1a1a2e; font-size: 1.1rem; font-weight: 800;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 8px 30px var(--glow); transition: all 0.3s;
        }
        .draw-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 40px var(--glow); }
        .draw-btn:active { transform: scale(0.97); }
        .draw-btn.rolling { background: linear-gradient(135deg, #ff6b6b, #ee5a24) !important; box-shadow: 0 8px 30px rgba(255,107,107,0.4); animation: pulse 1s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{box-shadow:0 8px 30px rgba(255,107,107,0.4)} 50%{box-shadow:0 8px 50px rgba(255,107,107,0.7)} }

        .history { margin-top: 20px; width: min(550px, 85vw); max-height: 90px; overflow-y: auto; scrollbar-width: none; }
        .history::-webkit-scrollbar { display: none; }
        .h-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 5px 14px; border-radius: 6px; margin-bottom: 4px; font-size: 12px; color: rgba(255,255,255,0.6); text-align: center; animation: fadeUp 0.4s; }
        .h-item b { color: var(--primary); }
        @keyframes fadeUp { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }

        .confetti { position: fixed; z-index: 100; pointer-events: none; animation: fall var(--dur,3s) ease-out forwards; }
        @keyframes fall { 0%{transform:translateY(-10vh) rotate(0) scale(1);opacity:1} 100%{transform:translateY(110vh) rotate(720deg) scale(0.3);opacity:0} }

        /* ===== 设置按钮 ===== */
        #settings-btn {
            position: fixed; bottom: 20px; right: 20px; z-index: 50;
            width: 44px; height: 44px; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08); border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: rgba(255,255,255,0.7); transition: all 0.2s;
            backdrop-filter: blur(10px);
        }
        #settings-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }

        /* ===== 设置弹窗 ===== */
        #settings-overlay {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center;
        }
        #settings-overlay.open { display: flex; }
        #settings-modal {
            width: min(500px, 92vw); max-height: 85vh;
            background: rgba(15,15,30,0.97); backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
            overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            animation: scaleIn 0.3s ease-out;
        }
        @keyframes scaleIn { from{transform:scale(0.9);opacity:0} to{transform:scale(1);opacity:1} }
        #settings-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        #settings-header h2 { font-size: 15px; color: #fff; font-weight: 700; }
        #settings-close { width: 30px; height: 30px; border: none; background: rgba(255,255,255,0.08); border-radius: 8px; cursor: pointer; font-size: 14px; color: rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; }
        #settings-close:hover { background: rgba(255,100,100,0.2); color: #ff6b6b; }
        #settings-tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 0 10px; overflow-x: auto; scrollbar-width: none; }
        #settings-tabs::-webkit-scrollbar { display: none; }
        .tab-btn { padding: 10px 12px; border: none; background: none; color: rgba(255,255,255,0.4); font-size: 12px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
        .tab-btn:hover { color: rgba(255,255,255,0.7); }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        #settings-body { flex: 1; overflow-y: auto; padding: 14px 18px; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .field { margin-bottom: 12px; }
        .field label { display: block; font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 4px; }
        .field input, .field select, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(255,255,255,0.05); color: #fff; font-size: 12px; outline: none; }
        .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); }
        .field select option { background: #1a1a2e; }
        .field-row { display: flex; gap: 8px; }
        .field-row > * { flex: 1; }
        .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .theme-card { height: 60px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; position: relative; overflow: hidden; transition: all 0.2s; background-size: cover; background-position: center; }
        .theme-card:hover { transform: scale(1.05); }
        .theme-card.active { border-color: var(--primary); box-shadow: 0 0 12px var(--glow); }
        .theme-card .t-name { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 9px; color: white; text-shadow: 0 1px 3px rgba(0,0,0,0.8); font-weight: 600; }
        .btn { padding: 10px 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; transition: all 0.2s; }
        .btn:hover { transform: translateY(-1px); opacity: 0.9; }
        .btn-gold { background: linear-gradient(135deg, #ffd700, #b8860b); color: #1a1a2e; }
        .btn-green { background: #2d8a4e; color: white; }
        .btn-red { background: #c0392b; color: white; }
        .btn-ghost { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        #save-msg { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 10px; text-align: center; }

        #shortcut-hint { position: fixed; bottom: 16px; left: 16px; z-index: 10; font-size: 11px; color: rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 6px; backdrop-filter: blur(10px); }
        #shortcut-hint kbd { background: rgba(255,255,255,0.1); padding: 1px 4px; border-radius: 3px; font-family: monospace; font-size: 10px; }
        #audio-toast { position: fixed; top: 20px; right: 20px; z-index: 100; background: rgba(0,0,0,0.6); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 12px; backdrop-filter: blur(10px); display: none; }

        @media (max-width: 768px) {
            .title { font-size: 32px; }
            .subtitle { font-size: 13px; }
            .lottery-box { height: 160px; }
            .slot { font-size: 1.6rem; }
            .draw-btn { width: 160px; height: 48px; font-size: 1rem; }
            #settings-modal { width: 95vw; max-height: 90vh; }
            .theme-grid { grid-template-columns: repeat(2, 1fr); }
            #shortcut-hint { display: none; }
            .theme-chinese .deco-left, .theme-chinese .deco-right { display: none; }
            .theme-tech .hud-corner { display: none; }
        }
    </style>
</head>
<body>

<div id="bg"></div>
<div id="bg-overlay"></div>
<canvas id="particles"></canvas>
<div id="audio-toast">🔊 音效已激活</div>

<!-- 主题装饰元素 -->
<div id="theme-decorations"></div>

<!-- 主内容 -->
<div id="app">
    <h1 class="title" id="title">🎊 年度盛典大抽奖</h1>
    <p class="subtitle" id="subtitle">✦ 让好运在这一刻发生 ✦</p>

    <div class="status">
        <div>剩余 <b id="remain">0</b> 人</div>
        <div>已抽 <b id="rounds">0</b> 轮</div>
    </div>

    <div class="lottery-box" id="lottery-box">
        <div class="slots" id="slots"></div>
    </div>

    <button class="draw-btn" id="draw-btn" onclick="toggleDraw()">
        <span id="btn-icon">🎁</span>
        <span id="btn-text">开始抽奖</span>
    </button>

    <div class="history" id="history"></div>
</div>

<!-- 快捷键提示 -->
<div id="shortcut-hint">
    <kbd>空格</kbd> 抽奖 &nbsp; <kbd>F</kbd> 全屏 &nbsp; <kbd>Esc</kbd> 设置
</div>

<!-- 设置按钮 -->
<button id="settings-btn" onclick="openSettings()">⚙️</button>

<!-- 设置弹窗 -->
<div id="settings-overlay" onclick="if(event.target===this)closeSettings()">
    <div id="settings-modal">
        <div id="settings-header">
            <h2>⚙️ 设置</h2>
            <button id="settings-close" onclick="closeSettings()">✕</button>
        </div>
        <div id="settings-tabs">
            <button class="tab-btn active" data-tab="theme">🎨 主题</button>
            <button class="tab-btn" data-tab="title">📌 标题</button>
            <button class="tab-btn" data-tab="sound">🎵 音效</button>
            <button class="tab-btn" data-tab="names">📋 名单</button>
            <button class="tab-btn" data-tab="records">📜 记录</button>
            <button class="tab-btn" data-tab="storage">💾 存储</button>
        </div>
        <div id="settings-body">
            <div class="tab-panel active" id="tab-theme">
                <div class="field">
                    <label>选择主题风格（每种风格有独立 UI 设计）</label>
                    <div class="theme-grid" id="theme-grid"></div>
                </div>
            </div>
            <div class="tab-panel" id="tab-title">
                <div class="field"><label>主标题</label><input type="text" id="in-title" value="🎊 年度盛典大抽奖" oninput="liveUpdate()"></div>
                <div class="field"><label>副标题</label><input type="text" id="in-subtitle" value="✦ 让好运在这一刻发生 ✦" oninput="liveUpdate()"></div>
                <div class="field"><label>标题大小</label><input type="number" id="in-size" value="56" oninput="liveUpdate()"></div>
                <div class="field"><label>按钮图标</label>
                    <select id="in-icon" onchange="liveUpdate()">
                        <option value="🎁">🎁 礼物</option><option value="🔥">🔥 火热</option>
                        <option value="⭐">⭐ 星星</option><option value="🏆">🏆 奖杯</option>
                        <option value="💎">💎 钻石</option><option value="🧧">🧧 红包</option>
                    </select>
                </div>
            </div>
            <div class="tab-panel" id="tab-sound">
                <div class="field"><label>抽奖音乐文件（放在同目录）</label><input type="text" id="in-music-roll" value="音乐1.mp3" placeholder="音乐1.mp3"></div>
                <div class="field"><label>中奖音乐文件（放在同目录）</label><input type="text" id="in-music-win" value="音乐2.mp3" placeholder="音乐2.mp3"></div>
                <div class="field"><label>抽奖音量</label><input type="range" id="in-vol-roll" min="0" max="1" step="0.1" value="0.6"></div>
                <div class="field"><label>中奖音量</label><input type="range" id="in-vol-win" min="0" max="1" step="0.1" value="0.8"></div>
                <div class="field"><label>纸屑特效</label>
                    <select id="in-confetti"><option value="on">开启 🎉</option><option value="off">关闭</option></select>
                </div>
                <div class="field"><div class="hint">将 mp3 文件放在 index.html 同目录即可使用自定义音乐</div></div>
            </div>
            <div class="tab-panel" id="tab-names">
                <div class="field"><label>同时抽奖人数</label><input type="number" id="in-count" value="1" min="1" max="10" oninput="initSlots()"></div>
                <div class="field"><label>名单（逗号或换行隔开）</label>
                    <textarea id="in-names" rows="5">陈明,王强,李芳,张伟,赵敏,孙杰,周涛,吴磊,郑洁,冯平,褚卫,卫华,蒋云,沈霞,韩梅,杨立,朱勇,秦丽,尤文,许博</textarea>
                </div>
                <div class="field-row">
                    <button class="btn btn-green" onclick="applyNames()">✓ 应用名单</button>
                </div>
            </div>
            <div class="tab-panel" id="tab-records">
                <div class="field"><label>中奖记录</label>
                    <div id="record-list" style="font-size:12px;background:rgba(255,255,255,0.05);padding:10px;border-radius:8px;max-height:120px;overflow-y:auto;color:rgba(255,255,255,0.5);">暂无记录</div>
                </div>
                <div class="field-row">
                    <button class="btn btn-ghost" onclick="exportWinners()">📤 导出</button>
                    <button class="btn btn-red" onclick="resetAll()">⟳ 重置</button>
                </div>
            </div>
            <div class="tab-panel" id="tab-storage">
                <div class="field-row">
                    <button class="btn btn-gold" onclick="saveSettings()">💾 保存</button>
                    <button class="btn btn-ghost" onclick="clearSettings()">🗑️ 清除</button>
                </div>
                <div id="save-msg">设置保存在浏览器中</div>
            </div>
        </div>
    </div>
</div>

<!-- 音频元素 -->
<audio id="audio-roll" loop></audio>
<audio id="audio-win"></audio>

<script>
    // ========== 主题配置 ==========
    const THEMES = [
        { id:'chinese',   name:'🏮 中国风',   bg:'assets/bg-chinese.png',   cls:'theme-chinese' },
        { id:'tech',      name:'⚡ 科技感',   bg:'assets/bg-tech.png',      cls:'theme-tech' },
        { id:'luxury',    name:'👑 黑金奢华', bg:'assets/bg-luxury.png',    cls:'theme-luxury' },
        { id:'beauty',    name:'💄 美妆风',   bg:'assets/bg-beauty.png',    cls:'theme-beauty' },
        { id:'finance',   name:'💰 金融风',   bg:'assets/bg-finance.png',   cls:'theme-finance' },
        { id:'lifestyle', name:'🏡 生活风',   bg:'assets/bg-lifestyle.png', cls:'theme-lifestyle' },
    ];
    let curTheme = THEMES[0];

    // ========== 粒子背景 ==========
    const cv = document.getElementById('particles'), cx = cv.getContext('2d');
    let pts = [], mx = 0, my = 0;
    function resize() { cv.width = innerWidth; cv.height = innerHeight; }
    addEventListener('resize', resize); resize();
    addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

    class Pt {
        constructor() { this.init(); }
        init() {
            this.x = Math.random()*cv.width; this.y = Math.random()*cv.height;
            this.s = Math.random()*3+1;
            this.vx = (Math.random()-0.5)*0.3; this.vy = (Math.random()-0.5)*0.3;
            this.o = Math.random()*0.3+0.1;
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            const dx = mx-this.x, dy = my-this.y, d = Math.sqrt(dx*dx+dy*dy);
            if (d < 120) { this.x -= dx*0.005; this.y -= dy*0.005; }
            if (this.x<0||this.x>cv.width||this.y<0||this.y>cv.height) this.init();
        }
        draw() {
            cx.beginPath(); cx.arc(this.x,this.y,this.s,0,Math.PI*2);
            cx.fillStyle = `rgba(255,255,255,${this.o})`; cx.fill();
        }
    }
    for (let i=0;i<80;i++) pts.push(new Pt());

    function drawParticles() {
        cx.clearRect(0,0,cv.width,cv.height);
        pts.forEach(p=>{p.update();p.draw();});
        requestAnimationFrame(drawParticles);
    }
    drawParticles();

    // ========== 主题切换 ==========
    function applyTheme(t) {
        curTheme = t;
        // 移除所有主题类
        document.body.className = '';
        // 添加新主题类
        document.body.classList.add(t.cls);
        // 设置背景
        document.getElementById('bg').style.backgroundImage = `url(${t.bg})`;
        // 更新装饰元素
        updateDecorations(t.id);
        // 更新主题选择器
        document.querySelectorAll('.theme-card').forEach(el => el.classList.toggle('active', el.dataset.id===t.id));
    }

    function updateDecorations(themeId) {
        const deco = document.getElementById('theme-decorations');
        deco.innerHTML = '';
        if (themeId === 'chinese') {
            deco.innerHTML = '<div class="deco-left">🏮</div><div class="deco-right">🏮</div>';
        } else if (themeId === 'tech') {
            deco.innerHTML = '<div class="hud-corner hud-tl"></div><div class="hud-corner hud-tr"></div><div class="hud-corner hud-bl"></div><div class="hud-corner hud-br"></div>';
        } else if (themeId === 'luxury') {
            deco.innerHTML = '<div class="gold-line gold-line-top"></div><div class="gold-line gold-line-bottom"></div>';
        } else if (themeId === 'beauty') {
            for (let i=0;i<6;i++) {
                const p = document.createElement('div');
                p.className = 'petal';
                p.innerText = '🌸';
                p.style.left = (10+Math.random()*80)+'%';
                p.style.top = (10+Math.random()*80)+'%';
                p.style.animationDelay = (Math.random()*3)+'s';
                deco.appendChild(p);
            }
        } else if (themeId === 'finance') {
            for (let i=1;i<6;i++) {
                const v = document.createElement('div');
                v.className = 'grid-line grid-v';
                v.style.left = (i*16.66)+'%';
                deco.appendChild(v);
            }
            for (let i=1;i<5;i++) {
                const h = document.createElement('div');
                h.className = 'grid-line grid-h';
                h.style.top = (i*20)+'%';
                deco.appendChild(h);
            }
        } else if (themeId === 'lifestyle') {
            for (let i=0;i<5;i++) {
                const l = document.createElement('div');
                l.className = 'leaf';
                l.innerText = '🍃';
                l.style.left = (10+Math.random()*80)+'%';
                l.style.top = (10+Math.random()*80)+'%';
                l.style.animationDelay = (Math.random()*2)+'s';
                deco.appendChild(l);
            }
        }
    }

    function initThemeGrid() {
        const g = document.getElementById('theme-grid');
        THEMES.forEach(t => {
            const d = document.createElement('div');
            d.className = 'theme-card'+(t.id==='chinese'?' active':'');
            d.dataset.id = t.id;
            d.style.backgroundImage = `url(${t.bg})`;
            d.innerHTML = `<div class="t-name">${t.name}</div>`;
            d.onclick = () => { applyTheme(t); };
            g.appendChild(d);
        });
    }

    // ========== 设置面板 ==========
    function openSettings() { document.getElementById('settings-overlay').classList.add('open'); updateRecords(); }
    function closeSettings() { document.getElementById('settings-overlay').classList.remove('open'); }

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
        };
    });

    // ========== 音效 ==========
    let audioOk = false;
    const toast = document.getElementById('audio-toast');
    const audioRoll = document.getElementById('audio-roll');
    const audioWin = document.getElementById('audio-win');

    function initAudio() {
        if (audioOk) return;
        audioOk = true;
        toast.style.display='block'; toast.textContent='🔊 音效已激活';
        setTimeout(()=>toast.style.display='none',2500);
    }
    document.addEventListener('click', ()=>initAudio(), {once:true});

    function playRollMusic() {
        const src = document.getElementById('in-music-roll').value;
        const vol = parseFloat(document.getElementById('in-vol-roll').value);
        if (vol <= 0 || !src) return;
        audioRoll.src = src;
        audioRoll.volume = vol;
        audioRoll.play().catch(()=>{});
    }

    function stopRollMusic() {
        audioRoll.pause();
        audioRoll.currentTime = 0;
    }

    function playWinMusic() {
        const src = document.getElementById('in-music-win').value;
        const vol = parseFloat(document.getElementById('in-vol-win').value);
        if (vol <= 0 || !src) return;
        audioWin.src = src;
        audioWin.volume = vol;
        audioWin.play().catch(()=>{});
        // 3秒后淡出
        setTimeout(() => {
            let v = audioWin.volume;
            const fade = setInterval(() => {
                if (v > 0.05) { v -= 0.05; audioWin.volume = v; }
                else { audioWin.pause(); audioWin.volume = vol; clearInterval(fade); }
            }, 100);
        }, 3000);
    }

    // ========== 纸屑 ==========
    function confetti() {
        if (document.getElementById('in-confetti').value==='off') return;
        const colors=['#ffd700','#ff6b6b','#48dbfb','#ff9ff3','#54a0ff','#ff4757','#2ed573','#ff6348','#ffa502'];
        for (let i=0;i<80;i++) {
            const p=document.createElement('div'); p.className='confetti';
            const c=colors[Math.floor(Math.random()*colors.length)], s=Math.random()*8+4;
            p.style.cssText=`left:${Math.random()*100}%;top:-10px;width:${s}px;height:${s*(Math.random()*0.5+0.5)}px;background:${c};border-radius:${Math.random()>0.5?'50%':'2px'};--dur:${Math.random()*2+2}s;animation-delay:${Math.random()*1.5}s;`;
            document.body.appendChild(p);
            setTimeout(()=>p.remove(),5000);
        }
    }

    // ========== 核心逻辑 ==========
    let pool=[], avail=[], winners=[], isRolling=false, timer=null, round=1;

    function liveUpdate() {
        document.getElementById('title').innerText = document.getElementById('in-title').value;
        document.getElementById('subtitle').innerText = document.getElementById('in-subtitle').value;
        document.getElementById('title').style.fontSize = document.getElementById('in-size').value+'px';
        document.getElementById('btn-icon').innerText = document.getElementById('in-icon').value;
    }

    function initSlots() {
        const n = parseInt(document.getElementById('in-count').value)||1;
        const c = document.getElementById('slots'); c.innerHTML='';
        for(let i=0;i<n;i++){ const s=document.createElement('div'); s.className='slot'; s.innerText='✨'; c.appendChild(s); }
    }

    function applyNames() {
        const text = document.getElementById('in-names').value;
        pool = text.split(/[,，\n]/).map(n=>n.trim()).filter(n=>n!=="");
        avail = pool.filter(n=>!winners.includes(n));
        document.getElementById('remain').innerText = avail.length;
        initSlots(); updateRecords();
        closeSettings();
    }

    function updateRecords() {
        const el = document.getElementById('record-list');
        el.innerHTML = winners.length===0 ? '暂无记录' : winners.map((w,i)=>`<div>🏆 第${i+1}轮: ${w}</div>`).join('');
    }

    function exportWinners() {
        if (winners.length===0) { alert('暂无中奖记录'); return; }
        const text = winners.map((w,i)=>`第${i+1}轮: ${w}`).join('\n');
        navigator.clipboard.writeText(text).then(()=>alert('✅ 已复制到剪贴板')).catch(()=>{
            const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
            ta.select(); document.execCommand('copy'); ta.remove(); alert('✅ 已复制到剪贴板');
        });
    }

    function resetAll() {
        if (!confirm('确定要重置所有数据吗？')) return;
        winners=[]; round=1; avail=[...pool];
        document.getElementById('history').innerHTML='';
        document.getElementById('remain').innerText=avail.length;
        document.getElementById('rounds').innerText='0';
        document.getElementById('lottery-box').classList.remove('winner');
        initSlots(); updateRecords();
    }

    function saveSettings() {
        try {
            const data = {
                theme: curTheme.id,
                s: {
                    title: document.getElementById('in-title').value,
                    subtitle: document.getElementById('in-subtitle').value,
                    size: document.getElementById('in-size').value,
                    icon: document.getElementById('in-icon').value,
                    count: document.getElementById('in-count').value,
                    names: document.getElementById('in-names').value,
                    musicRoll: document.getElementById('in-music-roll').value,
                    musicWin: document.getElementById('in-music-win').value,
                    volRoll: document.getElementById('in-vol-roll').value,
                    volWin: document.getElementById('in-vol-win').value,
                    confetti: document.getElementById('in-confetti').value
                },
                state: { pool, avail, winners, round }
            };
            localStorage.setItem('luckyMoment', JSON.stringify(data));
            document.getElementById('save-msg').innerText = '✅ 已保存 '+new Date().toLocaleTimeString();
        } catch(e) { document.getElementById('save-msg').innerText = '❌ 保存失败'; }
    }

    function loadSettings() {
        try {
            const raw = localStorage.getItem('luckyMoment');
            if (!raw) return;
            const data = JSON.parse(raw);
            if (data.theme) { const t=THEMES.find(t=>t.id===data.theme); if(t) applyTheme(t); }
            const s = data.s;
            if (s) {
                document.getElementById('in-title').value = s.title||'🎊 年度盛典大抽奖';
                document.getElementById('in-subtitle').value = s.subtitle||'✦ 让好运在这一刻发生 ✦';
                document.getElementById('in-size').value = s.size||'56';
                document.getElementById('in-icon').value = s.icon||'🎁';
                document.getElementById('in-count').value = s.count||'1';
                document.getElementById('in-names').value = s.names||'';
                document.getElementById('in-music-roll').value = s.musicRoll||'音乐1.mp3';
                document.getElementById('in-music-win').value = s.musicWin||'音乐2.mp3';
                document.getElementById('in-vol-roll').value = s.volRoll||'0.6';
                document.getElementById('in-vol-win').value = s.volWin||'0.8';
                document.getElementById('in-confetti').value = s.confetti||'on';
            }
            if (data.state) {
                pool=data.state.pool||[]; avail=data.state.avail||[...pool];
                winners=data.state.winners||[]; round=data.state.round||1;
            }
            liveUpdate(); initSlots();
            const h=document.getElementById('history'); h.innerHTML='';
            winners.forEach((w,i)=>{
                const d=document.createElement('div'); d.className='h-item';
                d.innerHTML=`<b>🏆 第${i+1}轮</b> · ${w}`; h.prepend(d);
            });
            document.getElementById('remain').innerText=avail.length;
            document.getElementById('rounds').innerText=winners.length;
            document.getElementById('save-msg').innerText='✅ 已恢复';
        } catch(e) { applyNames(); liveUpdate(); initSlots(); }
    }

    function clearSettings() {
        if (!confirm('确定要清除所有已保存的设置吗？')) return;
        localStorage.removeItem('luckyMoment');
        document.getElementById('save-msg').innerText='🗑️ 已清除';
        applyTheme(THEMES[0]); applyNames(); liveUpdate(); initSlots();
    }

    // ========== 抽奖 ==========
    function toggleDraw() {
        const count = parseInt(document.getElementById('in-count').value)||1;
        const btn = document.getElementById('draw-btn');
        const btnText = document.getElementById('btn-text');
        const box = document.getElementById('lottery-box');
        initAudio();

        if (!isRolling) {
            if (avail.length < count) { alert('🎯 可抽人数不足！'); return; }
            isRolling = true;
            btnText.innerText = '✋ 停！';
            btn.classList.add('rolling');
            playRollMusic();
            const slots = document.querySelectorAll('.slot');
            timer = setInterval(()=>{
                slots.forEach(s=>{
                    s.innerText = avail[Math.floor(Math.random()*avail.length)];
                    s.className = 'slot rolling';
                });
            },80);
        } else {
            isRolling = false;
            btnText.innerText = '🎯 开始抽奖';
            btn.classList.remove('rolling');
            clearInterval(timer);
            stopRollMusic();
            box.classList.add('winner');

            const slots = document.querySelectorAll('.slot');
            const roundWinners = [];
            for (let i=0;i<count;i++) {
                const idx = Math.floor(Math.random()*avail.length);
                const pick = avail.splice(idx,1)[0];
                roundWinners.push(pick); winners.push(pick);
                slots[i].innerText = pick;
                slots[i].className = 'slot winner';
            }

            const h = document.getElementById('history');
            const item = document.createElement('div');
            item.className = 'h-item';
            item.innerHTML = `<b>🏆 第${round}轮</b> · ${roundWinners.join('、')}`;
            h.prepend(item);

            round++;
            document.getElementById('remain').innerText = avail.length;
            document.getElementById('rounds').innerText = winners.length;
            playWinMusic();
            confetti();
            setTimeout(()=>box.classList.remove('winner'),3000);
        }
    }

    // ========== 全屏 ==========
    function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
        else document.exitFullscreen();
    }

    // ========== 快捷键 ==========
    document.addEventListener('keydown', e => {
        if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') return;
        if (e.code==='Space'||e.code==='Enter') { e.preventDefault(); toggleDraw(); }
        if (e.code==='KeyF') toggleFullscreen();
        if (e.code==='Escape') closeSettings();
    });

    // ========== 初始化 ==========
    window.onload = () => {
        initThemeGrid();
        applyTheme(THEMES[0]);
        const saved = localStorage.getItem('luckyMoment');
        if (saved) loadSettings();
        else { applyNames(); liveUpdate(); initSlots(); }
    };
</script>
</body>
</html>
