<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎊 至尊抽奖系统</title>
    <style>
        :root {
            --primary: #ffd700;
            --box-bg: rgba(255,255,255,0.08);
            --box-w: 720px; --box-h: 260px;
            --btn-w: 220px; --btn-h: 64px;
            --list-show: block;
            --theme-glow: rgba(255,215,0,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
        }

        /* ===== 背景层 ===== */
        #bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            transition: background 0.8s ease;
        }
        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; display: block;
        }
        /* 装饰光晕 */
        #bg-ornament {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
            background: radial-gradient(circle at 30% 20%, var(--theme-glow), transparent 50%),
                        radial-gradient(circle at 70% 80%, var(--theme-glow), transparent 50%);
            transition: background 0.8s ease;
        }

        #frontend {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 2; padding: 20px;
        }

        #title-container { text-align: center; margin-bottom: 20px; animation: fadeInDown 1s ease-out; }
        #main-title {
            font-size: 64px; font-weight: 900;
            text-shadow: 0 0 30px var(--theme-glow), 0 4px 20px rgba(0,0,0,0.5);
            letter-spacing: 8px;
            background: linear-gradient(180deg, #fff, var(--primary), var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            transition: all 0.5s ease;
        }
        #sub-title { color: rgba(255,255,255,0.6); margin-top: 8px; font-size: 18px; letter-spacing: 6px; font-weight: 300; }
        #remaining-info { color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 15px; letter-spacing: 2px; }
        #remaining-info span { color: var(--primary); font-weight: bold; font-size: 16px; }

        #lottery-box {
            width: var(--box-w); height: var(--box-h);
            border: 2px solid rgba(255,215,0,0.3);
            background: var(--box-bg);
            border-radius: 24px;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; margin-bottom: 30px; position: relative;
            box-shadow: 0 0 40px var(--theme-glow), inset 0 0 60px rgba(255,215,0,0.05);
            transition: all 0.3s ease;
        }
        #lottery-box::before {
            content: ''; position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 26px;
            background: linear-gradient(45deg,transparent,var(--primary),transparent,var(--primary),transparent);
            background-size: 200% 200%; z-index: -1;
            animation: borderGlow 3s linear infinite;
        }
        @keyframes borderGlow { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
        #lottery-box.winner-active {
            box-shadow: 0 0 80px var(--theme-glow), inset 0 0 60px rgba(255,215,0,0.1);
            border-color: var(--primary);
        }

        .slot-container { display: flex; justify-content: center; align-items: center; gap: 20px; width: 100%; padding: 0 30px; }
        .name-slot {
            flex: 1; text-align: center; color: rgba(255,255,255,0.9); font-size: 3rem;
            font-weight: 700; text-shadow: 0 0 20px rgba(0,0,0,0.5);
            padding: 10px; min-height: 80px; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; position: relative;
        }
        .name-slot:not(:last-child)::after {
            content: ''; position: absolute; right: -10px; top: 20%; height: 60%;
            width: 1px; background: rgba(255,255,255,0.1);
        }
        .rolling-text { color: rgba(255,255,255,0.7); animation: textFlicker 0.08s infinite; }
        @keyframes textFlicker { 0%,100%{opacity:0.7;transform:scale(1)} 50%{opacity:1;transform:scale(1.02)} }
        .winner-text {
            color: var(--primary);
            text-shadow: 0 0 20px var(--theme-glow), 0 0 40px var(--theme-glow);
            animation: winPop 0.6s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
        }
        @keyframes winPop { 0%{transform:scale(0.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }

        #draw-btn {
            width: var(--btn-w); height: var(--btn-h); border: none;
            background: linear-gradient(135deg,var(--primary),var(--primary-dark));
            color: #1a1a2e; border-radius: 50px; cursor: pointer;
            font-size: 1.3rem; font-weight: 800; display: flex;
            align-items: center; justify-content: center; gap: 12px;
            letter-spacing: 3px; position: relative; overflow: hidden;
            box-shadow: 0 8px 32px var(--theme-glow);
            transition: all 0.3s ease;
        }
        #draw-btn::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg,transparent,rgba(255,255,255,0.2),transparent);
            transform: rotate(45deg); animation: btnShine 3s ease-in-out infinite;
        }
        @keyframes btnShine { 0%{transform:translateX(-100%) rotate(45deg)} 100%{transform:translateX(100%) rotate(45deg)} }
        #draw-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 40px var(--theme-glow); }
        #draw-btn:active { transform: translateY(0) scale(0.98); }
        #draw-btn.rolling {
            background: linear-gradient(135deg,#ff6b6b,#ee5a24);
            box-shadow: 0 8px 32px rgba(255,107,107,0.4);
            animation: btnPulse 1s ease-in-out infinite;
        }
        @keyframes btnPulse { 0%,100%{box-shadow:0 8px 32px rgba(255,107,107,0.4)} 50%{box-shadow:0 8px 48px rgba(255,107,107,0.7)} }

        #round-history {
            margin-top: 20px; width: 70%; max-height: 120px; overflow-y: auto;
            display: var(--list-show); scrollbar-width: none;
        }
        .history-item {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,215,0,0.1);
            margin-bottom: 4px; padding: 6px 16px; border-radius: 8px;
            font-size: 13px; color: rgba(255,255,255,0.7); text-align: center;
            animation: fadeIn 0.5s; backdrop-filter: blur(10px);
        }
        .history-item .round-label { color: var(--primary); font-weight: 600; }

        .confetti-piece {
            position: fixed; width: 10px; height: 10px; z-index: 100;
            pointer-events: none;
            animation: confettiFall var(--fall-duration,3s) ease-out forwards;
        }
        @keyframes confettiFall { 0%{transform:translateY(-10vh)rotate(0deg)scale(1);opacity:1} 100%{transform:translateY(110vh)rotate(720deg)scale(0.3);opacity:0} }

        #backend-icon {
            position: fixed; bottom: 24px; left: 24px; width: 48px; height: 48px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; cursor: pointer; z-index: 1000;
            transition: all 0.3s ease;
        }
        #backend-icon:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }

        #backend-panel {
            position: fixed; bottom: 80px; left: 24px; width: 420px; max-height: 75vh;
            background: rgba(20,20,40,0.95); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6); z-index: 999;
            display: none; flex-direction: column; overflow-y: auto; color: #eee;
        }
        #backend-panel::-webkit-scrollbar { width: 4px; }
        #backend-panel::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.3); border-radius: 2px; }
        .setting-group { margin-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 14px; }
        .setting-group:last-child { border-bottom: none; margin-bottom: 0; }
        .setting-group h3 { margin: 0 0 10px 0; font-size: 13px; color: var(--primary); font-weight: 600; letter-spacing: 1px; }
        .setting-group label { display: block; font-size: 11px; margin-bottom: 4px; font-weight: 500; color: rgba(255,255,255,0.5); }
        .setting-group input,.setting-group select,.setting-group textarea {
            width: 100%; padding: 8px 10px; margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            background: rgba(255,255,255,0.06); color: #eee; font-size: 12px; outline: none;
        }
        .setting-group input:focus,.setting-group select:focus,.setting-group textarea:focus {
            border-color: rgba(255,215,0,0.4); background: rgba(255,255,255,0.1);
        }
        .setting-group select option { background: #1a1a2e; color: #eee; }
        .hint { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: -6px; margin-bottom: 8px; display: block; }
        .flex-row { display: flex; gap: 8px; }
        .action-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; transition: all 0.2s; }
        .action-btn:hover { transform: translateY(-1px); opacity: 0.9; }
        .btn-green { background: #2d8a4e; color: white; }
        .btn-red { background: #c0392b; color: white; }
        .btn-blue { background: #2c6fbb; color: white; }
        .btn-gold { background: linear-gradient(135deg,#ffd700,#b8860b); color: #1a1a2e; font-weight: 700; }
        #save-status { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 8px; }
        #audio-status { position: fixed; bottom: 80px; right: 20px; font-size: 12px; color: rgba(255,255,255,0.4); z-index: 100; background: rgba(0,0,0,0.4); padding: 6px 14px; border-radius: 20px; backdrop-filter: blur(10px); display: none; }

        .theme-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 8px; }
        .theme-option { height: 56px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; position: relative; overflow: hidden; }
        .theme-option:hover { transform: scale(1.05); }
        .theme-option.active { border-color: #ffd700; box-shadow: 0 0 12px rgba(255,215,0,0.4); }
        .theme-option .label { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 8px; color: white; text-shadow: 0 1px 4px rgba(0,0,0,0.8); font-weight: 600; letter-spacing: 0.5px; }

        @keyframes fadeInDown { from{opacity:0;transform:translateY(-30px)} to{opacity:1;transform:translateY(0)} }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

        @media (max-width:768px) {
            :root { --box-w:90vw; --box-h:200px; --btn-w:180px; --btn-h:54px; }
            #main-title { font-size: 36px; letter-spacing: 4px; }
            #sub-title { font-size: 14px; }
            .name-slot { font-size: 2rem; }
            #backend-panel { width: 90vw; left: 5vw; bottom: 70px; }
        }
    </style>
</head>
<body>

<div id="bg-layer"></div>
<canvas id="bg-canvas"></canvas>
<div id="bg-ornament"></div>
<div id="audio-status">🔊 音效已激活</div>

<div id="frontend">
    <div id="title-container">
        <h1 id="main-title">🎊 年度盛典大抽奖</h1>
        <div id="sub-title">✦ 让好运在这一刻发生 ✦</div>
    </div>
    <div id="remaining-info">剩余可抽人数 · <span id="remain-count">0</span> 人</div>
    <div id="lottery-box"><div class="slot-container" id="slot-container"></div></div>
    <button id="draw-btn" onclick="toggleDraw()">
        <span id="cfg-btn-icon-disp">🎁</span>
        <span id="draw-btn-text">开始抽奖</span>
    </button>
    <div id="round-history"></div>
</div>

<div id="backend-icon" onclick="togglePanel()">⚙️</div>

<div id="backend-panel">
    <div class="setting-group">
        <h3>🎨 1. 主题风格</h3>
        <label>点击切换（粒子、光晕、主色同步变化）</label>
        <div class="theme-grid" id="theme-grid"></div>
    </div>
    <div class="setting-group">
        <h3>📌 2. 标题设置</h3>
        <label>主标题</label><input type="text" id="in-m-title" value="🎊 年度盛典大抽奖" oninput="liveUpdate()">
        <label>副标题</label><input type="text" id="in-s-title" value="✦ 让好运在这一刻发生 ✦" oninput="liveUpdate()">
        <label>标题大小</label><input type="number" id="in-m-size" value="64" oninput="liveUpdate()">
    </div>
    <div class="setting-group">
        <h3>🎵 3. 音效配置</h3>
        <label>抽奖音效音量</label><input type="range" id="in-vol-roll" min="0" max="1" step="0.1" value="0.6">
        <label>中奖音效音量</label><input type="range" id="in-vol-win" min="0" max="1" step="0.1" value="0.8">
        <label>纸屑特效</label>
        <select id="in-confetti"><option value="on">开启 🎉</option><option value="off">关闭</option></select>
        <span class="hint">点击抽奖即激活音效，内置喜庆鼓乐+胜利号角，无需外部文件</span>
    </div>
    <div class="setting-group">
        <h3>📐 4. 样式</h3>
        <div class="flex-row">
            <input type="number" id="in-box-w" value="720" oninput="liveUpdate()" placeholder="宽">
            <input type="number" id="in-box-h" value="260" oninput="liveUpdate()" placeholder="高">
        </div>
        <label>按钮图标</label>
        <select id="in-btn-icon" onchange="liveUpdate()">
            <option value="🎁">🎁 礼物</option><option value="🔥">🔥 火热</option><option value="⭐">⭐ 星星</option>
            <option value="🏆">🏆 奖杯</option><option value="💎">💎 钻石</option><option value="🧧">🧧 红包</option>
        </select>
        <label>中奖名单</label>
        <select id="in-list-show" onchange="liveUpdate()">
            <option value="block">显示</option><option value="none">隐藏</option>
        </select>
    </div>
    <div class="setting-group">
        <h3>📋 5. 名单与抽奖</h3>
        <label>同时抽奖人数</label><input type="number" id="in-draw-count" value="1" min="1" max="10" oninput="initSlots()">
        <label>名单（逗号隔开）</label>
        <textarea id="in-names" rows="3">陈明,王强,李芳,张伟,赵敏,孙杰,周涛,吴磊,郑洁,冯平,褚卫,卫华,蒋云,沈霞,韩梅,杨立,朱勇,秦丽,尤文,许博</textarea>
        <div class="flex-row"><button class="action-btn btn-green" onclick="saveNames()">✓ 应用名单</button></div>
    </div>
    <div class="setting-group">
        <h3>📜 6. 记录管理</h3>
        <div id="backend-record-list" style="font-size:11px;background:rgba(0,0,0,0.2);padding:8px;border-radius:6px;max-height:60px;overflow-y:auto;color:rgba(255,255,255,0.6);">无记录</div>
        <div class="flex-row" style="margin-top:8px;"><button class="action-btn btn-red" onclick="resetLottery()">⟳ 全系统重置</button></div>
    </div>
    <div class="setting-group">
        <h3>💾 7. 持久化存储</h3>
        <div class="flex-row">
            <button class="action-btn btn-gold" onclick="saveSettings()">💾 保存</button>
            <button class="action-btn" style="background:rgba(255,255,255,0.1);color:#eee;" onclick="clearSettings()">🗑️ 清除</button>
        </div>
        <span id="save-status">关闭后自动恢复</span>
    </div>
</div>

<script>
    // ========== 主题配置 ==========
    const THEMES = [
        { id:'chinese-red',   name:'🏮 中国风',   bg1:'#1a0505', bg2:'#4a0a0a', bg3:'#2a0505', primary:'#ff2222', glow:'rgba(255,34,34,0.3)', count:100, color:'255,50,50' },
        { id:'golden-gala',   name:'🥇 年会金',   bg1:'#1a1200', bg2:'#3a2a00', bg3:'#2a1a00', primary:'#ffd700', glow:'rgba(255,215,0,0.35)', count:120, color:'255,215,0' },
        { id:'beauty-pink',   name:'💄 美妆风',   bg1:'#1a0510', bg2:'#3a1025', bg3:'#2a0818', primary:'#ff69b4', glow:'rgba(255,105,180,0.3)', count:130, color:'255,105,180' },
        { id:'spring-fest',   name:'🧧 新春',     bg1:'#0a0a00', bg2:'#3a0a00', bg3:'#1a0500', primary:'#ff4400', glow:'rgba(255,68,0,0.3)', count:110, color:'255,68,0' },
        { id:'royal-purple',  name:'👑 紫金',     bg1:'#0a0015', bg2:'#2a0040', bg3:'#1a0020', primary:'#b388ff', glow:'rgba(179,136,255,0.3)', count:120, color:'179,136,255' },
        { id:'luxury-black',  name:'🖤 黑金奢华', bg1:'#0a0a0a', bg2:'#1a1a0a', bg3:'#0a0a0a', primary:'#ffd700', glow:'rgba(255,215,0,0.3)', count:90, color:'255,215,0' },
        { id:'aurora',        name:'🌌 极光',     bg1:'#0a1628', bg2:'#1a3a3a', bg3:'#0d2818', primary:'#00ff88', glow:'rgba(0,255,136,0.3)', count:100, color:'0,255,136' },
        { id:'sunset',        name:'🌅 落日余晖', bg1:'#1a0a0a', bg2:'#4a1a0a', bg3:'#2a0a0a', primary:'#ff6b35', glow:'rgba(255,107,53,0.3)', count:110, color:'255,107,53' },
        { id:'ocean',         name:'🌊 深海蓝',   bg1:'#0a1628', bg2:'#0a2a4a', bg3:'#0a1a2a', primary:'#00bfff', glow:'rgba(0,191,255,0.3)', count:100, color:'0,191,255' },
        { id:'cyberpunk',     name:'⚡ 赛博朋克', bg1:'#0a0015', bg2:'#1a0030', bg3:'#0a0020', primary:'#ff00ff', glow:'rgba(255,0,255,0.3)', count:140, color:'255,0,255' },
        { id:'forest',        name:'🌲 森林秘境', bg1:'#0a1a0a', bg2:'#1a2a0a', bg3:'#0a1a0a', primary:'#7ec850', glow:'rgba(126,200,80,0.3)', count:90, color:'126,200,80' },
        { id:'sakura',        name:'🌸 樱花',     bg1:'#1a0a1a', bg2:'#3a1a2a', bg3:'#2a0a1a', primary:'#ff6b9d', glow:'rgba(255,107,157,0.3)', count:130, color:'255,107,157' },
    ];

    let currentTheme = THEMES[0];
    let themeColors = { bg1:'#1a0505', bg2:'#4a0a0a', bg3:'#2a0505', color:'255,50,50', glow:'rgba(255,34,34,0.3)' };

    // ========== Canvas 粒子 ==========
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouseX = 0, mouseY = 0;

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 4 + 1.5;
            this.speedX = (Math.random() - 0.5) * 0.4;
            this.speedY = (Math.random() - 0.5) * 0.4;
            this.opacity = Math.random() * 0.4 + 0.15;
            this.pColor = themeColors.color;
        }
        update() {
            this.x += this.speedX; this.y += this.speedY;
            const dx = mouseX - this.x, dy = mouseY - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 150) { this.x -= dx * 0.008; this.y -= dy * 0.008; }
            if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.pColor}, ${this.opacity})`;
            ctx.fill();
            ctx.shadowBlur = 15;
            ctx.shadowColor = `rgba(${this.pColor}, 0.4)`;
        }
    }

    function initParticles(count) {
        particles = [];
        for (let i = 0; i < (count || 100); i++) particles.push(new Particle());
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grad.addColorStop(0, themeColors.bg1);
        grad.addColorStop(0.5, themeColors.bg2);
        grad.addColorStop(1, themeColors.bg3);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // 连接线
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 130) {
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = `rgba(255,255,255,${0.03 * (1 - dist / 130)})`;
                    ctx.stroke();
                }
            }
        }
        particles.forEach(p => { p.update(); p.draw(); });
        ctx.shadowBlur = 0;
        requestAnimationFrame(animateParticles);
    }
    initParticles(100);
    animateParticles();

    function applyTheme(theme) {
        currentTheme = theme;
        themeColors = { bg1: theme.bg1, bg2: theme.bg2, bg3: theme.bg3, color: theme.color, glow: theme.glow };
        document.getElementById('bg-layer').style.background = `linear-gradient(135deg, ${theme.bg1}, ${theme.bg2}, ${theme.bg3})`;
        document.getElementById('bg-ornament').style.background = `radial-gradient(circle at 30% 20%, ${theme.glow}, transparent 50%), radial-gradient(circle at 70% 80%, ${theme.glow}, transparent 50%)`;
        document.documentElement.style.setProperty('--primary', theme.primary);
        document.documentElement.style.setProperty('--theme-glow', theme.glow);
        const title = document.getElementById('main-title');
        title.style.background = `linear-gradient(180deg, #fff, ${theme.primary}, ${theme.primary}cc)`;
        title.style.webkitBackgroundClip = 'text';
        title.style.webkitTextFillColor = 'transparent';
        title.style.backgroundClip = 'text';
        initParticles(theme.count || 100);
        document.querySelectorAll('.theme-option').forEach(el => {
            el.classList.toggle('active', el.dataset.theme === theme.id);
        });
    }

    function initThemeSelector() {
        const grid = document.getElementById('theme-grid');
        THEMES.forEach(t => {
            const div = document.createElement('div');
            div.className = 'theme-option' + (t.id === 'chinese-red' ? ' active' : '');
            div.dataset.theme = t.id;
            div.style.background = `linear-gradient(135deg, ${t.bg1}, ${t.bg2}, ${t.bg3})`;
            div.innerHTML = `<div class="label">${t.name}</div>`;
            div.onclick = () => { applyTheme(t); liveUpdate(); };
            grid.appendChild(div);
        });
    }

    // ========== 音效系统（激昂喜庆版） ==========
    let audioCtx = null;
    let audioReady = false;
    const audioStatus = document.getElementById('audio-status');

    async function initAudio() {
        if (audioReady) return true;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            audioReady = true;
            audioStatus.style.display = 'block';
            audioStatus.textContent = '🔊 音效已激活';
            setTimeout(() => { audioStatus.style.display = 'none'; }, 3000);
            return true;
        } catch(e) {
            audioStatus.style.display = 'block';
            audioStatus.textContent = '⚠️ 音效不可用';
            return false;
        }
    }
    document.addEventListener('click', () => { initAudio(); }, { once: true });

    // 喜庆鼓乐 - 抽奖滚动音效
    function playRollSound() {
        if (!audioReady || !audioCtx) return;
        const vol = parseFloat(document.getElementById('in-vol-roll').value);
        if (vol <= 0) return;
        let beat = 0;
        const interval = setInterval(() => {
            if (!isRolling) { clearInterval(interval); return; }
            try {
                beat++;
                // 鼓点：低音砰砰砰
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                // 交替高低鼓点
                const freq = beat % 4 === 0 ? 80 : (beat % 2 === 0 ? 120 : 100);
                osc.frequency.value = freq;
                const t = audioCtx.currentTime;
                gain.gain.setValueAtTime(vol * 0.25, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
                osc.start(t);
                osc.stop(t + 0.08);

                // 每拍加一个高音镲片声
                if (beat % 2 === 0) {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.type = 'sine';
                    osc2.frequency.value = 1200 + Math.random() * 800;
                    gain2.gain.setValueAtTime(vol * 0.08, t);
                    gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
                    osc2.start(t);
                    osc2.stop(t + 0.04);
                }
            } catch(e) {}
        }, 120);
    }

    // 胜利号角 + 鞭炮 + 锣鼓 - 中奖音效
    function playWinSound() {
        if (!audioReady || !audioCtx) return;
        const vol = parseFloat(document.getElementById('in-vol-win').value);
        if (vol <= 0) return;
        try {
            const t = audioCtx.currentTime;
            // 1. 胜利号角上行（C5→E5→G5→C6）
            const fanfare = [523, 659, 784, 1047];
            fanfare.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.value = freq;
                const start = t + i * 0.12;
                gain.gain.setValueAtTime(0, start);
                gain.gain.linearRampToValueAtTime(vol * 0.3, start + 0.05);
                gain.gain.setValueAtTime(vol * 0.3, start + 0.2);
                gain.gain.exponentialRampToValueAtTime(0.001, start + 0.4);
                osc.start(start);
                osc.stop(start + 0.4);
            });

            // 2. 锣鼓：低音震荡（喜庆感）
            [0, 0.2, 0.4, 0.6].forEach(delay => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.value = 120 + Math.random() * 40;
                const start = t + 0.3 + delay;
                gain.gain.setValueAtTime(0, start);
                gain.gain.linearRampToValueAtTime(vol * 0.15, start + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, start + 0.2);
                osc.start(start);
                osc.stop(start + 0.2);
            });

            // 3. 鞭炮声（白噪声快速爆裂）
            for (let i = 0; i < 12; i++) {
                setTimeout(() => {
                    try {
                        const bufSize = audioCtx.sampleRate * 0.06;
                        const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
                        const data = buf.getChannelData(0);
                        for (let j = 0; j < bufSize; j++) {
                            data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (bufSize * 0.15));
                        }
                        const noise = audioCtx.createBufferSource();
                        const ng = audioCtx.createGain();
                        noise.buffer = buf;
                        noise.connect(ng);
                        ng.connect(audioCtx.destination);
                        ng.gain.value = vol * 0.12;
                        noise.start();
                        ng.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                    } catch(e) {}
                }, i * 60 + 200);
            }

            // 4. 欢呼/鼓掌（持续白噪声）
            setTimeout(() => {
                try {
                    const bufSize = audioCtx.sampleRate * 1.0;
                    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
                    const data = buf.getChannelData(0);
                    for (let i = 0; i < bufSize; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.5));
                    }
                    const noise = audioCtx.createBufferSource();
                    const ng = audioCtx.createGain();
                    noise.buffer = buf;
                    noise.connect(ng);
                    ng.connect(audioCtx.destination);
                    ng.gain.value = vol * 0.06;
                    noise.start();
                    ng.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
                } catch(e) {}
            }, 400);
        } catch(e) {}
    }

    // ========== 纸屑 ==========
    function fireConfetti() {
        if (document.getElementById('in-confetti').value === 'off') return;
        const colors = ['#ffd700','#ff6b6b','#48dbfb','#ff9ff3','#54a0ff','#ff4757','#2ed573','#ff6348','#ffa502'];
        for (let i = 0; i < 80; i++) {
            const p = document.createElement('div');
            p.className = 'confetti-piece';
            const c = colors[Math.floor(Math.random()*colors.length)];
            const s = Math.random()*8+4;
            p.style.cssText = `left:${Math.random()*100}%;top:-10px;width:${s}px;height:${s*(Math.random()*0.5+0.5)}px;background:${c};border-radius:${Math.random()>0.5?'50%':'2px'};--fall-duration:${Math.random()*2+2}s;animation-delay:${Math.random()*1.5}s;`;
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 5000);
        }
    }

    // ========== 核心变量 ==========
    let pool = [], available = [], winners = [], currentRoundWinners = [];
    let isRolling = false, timer = null, currentRound = 1;

    window.onload = () => {
        initThemeSelector();
        applyTheme(THEMES[0]);
        const saved = localStorage.getItem('luckyDrawData');
        if (saved) { loadSettings(); }
        else { saveNames(); liveUpdate(); initSlots(); }
    };

    function togglePanel() {
        const p = document.getElementById('backend-panel');
        p.style.display = (p.style.display === 'flex') ? 'none' : 'flex';
        if (p.style.display === 'flex') updateBackendRecord();
    }

    function liveUpdate() {
        document.getElementById('main-title').innerText = document.getElementById('in-m-title').value;
        document.getElementById('sub-title').innerText = document.getElementById('in-s-title').value;
        document.getElementById('main-title').style.fontSize = document.getElementById('in-m-size').value + 'px';
        document.documentElement.style.setProperty('--box-w', document.getElementById('in-box-w').value + 'px');
        document.documentElement.style.setProperty('--box-h', document.getElementById('in-box-h').value + 'px');
        document.getElementById('cfg-btn-icon-disp').innerText = document.getElementById('in-btn-icon').value;
        document.documentElement.style.setProperty('--list-show', document.getElementById('in-list-show').value);
    }

    function initSlots() {
        const count = parseInt(document.getElementById('in-draw-count').value) || 1;
        const container = document.getElementById('slot-container');
        container.innerHTML = '';
        for (let i = 0; i < count; i++) {
            const s = document.createElement('div');
            s.className = 'name-slot'; s.innerText = '✨';
            container.appendChild(s);
        }
    }

    function saveNames() {
        const text = document.getElementById('in-names').value;
        pool = text.split(/[,，\n]/).map(n => n.trim()).filter(n => n !== "");
        available = [...pool]; winners = []; currentRound = 1;
        document.getElementById('round-history').innerHTML = '';
        document.getElementById('remain-count').innerText = available.length;
        initSlots(); updateBackendRecord();
    }

    function updateBackendRecord() {
        const rec = document.getElementById('backend-record-list');
        rec.innerHTML = winners.length === 0
            ? '📋 名单已加载，共 ' + pool.length + ' 人'
            : winners.map((w,i) => `<div>🏆 第 ${i+1} 轮: ${w}</div>`).join('');
    }

    function saveSettings() {
        try {
            const data = {
                theme: currentTheme.id,
                settings: {
                    mTitle: document.getElementById('in-m-title').value,
                    sTitle: document.getElementById('in-s-title').value,
                    mSize: document.getElementById('in-m-size').value,
                    boxW: document.getElementById('in-box-w').value,
                    boxH: document.getElementById('in-box-h').value,
                    btnIcon: document.getElementById('in-btn-icon').value,
                    listShow: document.getElementById('in-list-show').value,
                    drawCount: document.getElementById('in-draw-count').value,
                    names: document.getElementById('in-names').value,
                    volRoll: document.getElementById('in-vol-roll').value,
                    volWin: document.getElementById('in-vol-win').value,
                    confetti: document.getElementById('in-confetti').value
                },
                state: { pool, available, winners, currentRound }
            };
            localStorage.setItem('luckyDrawData', JSON.stringify(data));
            document.getElementById('save-status').innerText = '✅ 已保存 ' + new Date().toLocaleTimeString();
        } catch(e) { document.getElementById('save-status').innerText = '❌ 保存失败'; }
    }

    function loadSettings() {
        try {
            const raw = localStorage.getItem('luckyDrawData');
            if (!raw) return;
            const data = JSON.parse(raw);
            if (data.theme) {
                const t = THEMES.find(t => t.id === data.theme);
                if (t) applyTheme(t);
            }
            const s = data.settings;
            if (s) {
                document.getElementById('in-m-title').value = s.mTitle || '🎊 年度盛典大抽奖';
                document.getElementById('in-s-title').value = s.sTitle || '✦ 让好运在这一刻发生 ✦';
                document.getElementById('in-m-size').value = s.mSize || '64';
                document.getElementById('in-box-w').value = s.boxW || '720';
                document.getElementById('in-box-h').value = s.boxH || '260';
                document.getElementById('in-btn-icon').value = s.btnIcon || '🎁';
                document.getElementById('in-list-show').value = s.listShow || 'block';
                document.getElementById('in-draw-count').value = s.drawCount || '1';
                document.getElementById('in-names').value = s.names || '陈明,王强,李芳,张伟,赵敏,孙杰,周涛,吴磊,郑洁,冯平,褚卫,卫华,蒋云,沈霞,韩梅,杨立,朱勇,秦丽,尤文,许博';
                document.getElementById('in-vol-roll').value = s.volRoll || '0.6';
                document.getElementById('in-vol-win').value = s.volWin || '0.8';
                document.getElementById('in-confetti').value = s.confetti || 'on';
            }
            if (data.state) {
                pool = data.state.pool || [];
                available = data.state.available || [...pool];
                winners = data.state.winners || [];
                currentRound = data.state.currentRound || 1;
            }
            liveUpdate(); initSlots();
            const history = document.getElementById('round-history');
            history.innerHTML = '';
            winners.forEach((w,i) => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `<span class="round-label">🏆 第 ${i+1} 轮</span> · ${w}`;
                history.prepend(item);
            });
            document.getElementById('remain-count').innerText = available.length;
            document.getElementById('save-status').innerText = '✅ 已恢复';
        } catch(e) { saveNames(); liveUpdate(); initSlots(); }
    }

    function clearSettings() {
        if (confirm('确定要清除所有已保存的设置吗？')) {
            localStorage.removeItem('luckyDrawData');
            document.getElementById('save-status').innerText = '🗑️ 已清除';
            applyTheme(THEMES[0]); saveNames(); liveUpdate(); initSlots();
        }
    }

    function toggleDraw() {
        const count = parseInt(document.getElementById('in-draw-count').value) || 1;
        const btnText = document.getElementById('draw-btn-text');
        const btn = document.getElementById('draw-btn');
        const box = document.getElementById('lottery-box');
        initAudio();

        if (!isRolling) {
            if (available.length < count) { alert('🎯 可抽人数不足！'); return; }
            isRolling = true;
            btnText.innerText = '✋ 停！';
            btn.classList.add('rolling');
            playRollSound();

            const slots = document.querySelectorAll('.name-slot');
            timer = setInterval(() => {
                slots.forEach(slot => {
                    const idx = Math.floor(Math.random() * available.length);
                    slot.innerText = available[idx];
                    slot.className = 'name-slot rolling-text';
                });
            }, 80);
        } else {
            isRolling = false;
            btnText.innerText = '🎯 开始抽奖';
            btn.classList.remove('rolling');
            clearInterval(timer);
            box.classList.add('winner-active');

            currentRoundWinners = [];
            const slots = document.querySelectorAll('.name-slot');
            for (let i = 0; i < count; i++) {
                const idx = Math.floor(Math.random() * available.length);
                const pick = available.splice(idx, 1)[0];
                currentRoundWinners.push(pick);
                winners.push(pick);
                slots[i].innerText = pick;
                slots[i].className = 'name-slot winner-text';
            }
            addHistory(currentRoundWinners);
            currentRound++;
            document.getElementById('remain-count').innerText = available.length;
            playWinSound();
            fireConfetti();
            setTimeout(() => box.classList.remove('winner-active'), 3000);
        }
    }

    function addHistory(list) {
        const history = document.getElementById('round-history');
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `<span class="round-label">🏆 第 ${currentRound} 轮</span> · ${list.join('、')}`;
        history.prepend(item);
        updateBackendRecord();
    }

    function resetLottery() {
        if (confirm('确定要重置所有数据吗？')) {
            saveNames();
            document.getElementById('lottery-box').classList.remove('winner-active');
        }
    }
</script>
